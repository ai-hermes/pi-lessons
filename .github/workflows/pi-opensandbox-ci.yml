name: pi-opensandbox CI

on:
  pull_request:
    paths:
      - "apps/extensions/pi-opensandbox/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pi-opensandbox-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm --filter ./apps/extensions/pi-opensandbox install --frozen-lockfile
      - run: pnpm --dir apps/extensions/pi-opensandbox typecheck
      - run: pnpm --dir apps/extensions/pi-opensandbox test
      - run: pnpm --dir apps/extensions/pi-opensandbox exec npm pack --dry-run
