name: pi-opensandbox release

on:
  push:
    branches:
      - main
    paths:
      - "apps/extensions/pi-opensandbox/**"
      - ".github/workflows/pi-opensandbox-release.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pi-opensandbox-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm --filter ./apps/extensions/pi-opensandbox install --frozen-lockfile
      - run: pnpm --dir apps/extensions/pi-opensandbox typecheck
      - run: pnpm --dir apps/extensions/pi-opensandbox test
      - id: package
        working-directory: apps/extensions/pi-opensandbox
        shell: bash
        run: |
          if latest=$(npm view @ai-hermes/pi-opensandbox version --registry=https://registry.npmjs.org 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publish @ai-hermes/pi-opensandbox@0.1.0 manually, then configure npm Trusted Publisher."
          fi
      - if: steps.package.outputs.exists == 'true'
        working-directory: apps/extensions/pi-opensandbox
        env:
          LATEST_VERSION: ${{ steps.package.outputs.latest }}
        run: |
          next=$(node -e 'const [major,minor,patch]=process.env.LATEST_VERSION.split(".").map(Number); console.log(`${major}.${minor}.${patch+1}`)')
          npm version "$next" --no-git-tag-version
          npm publish --access public
