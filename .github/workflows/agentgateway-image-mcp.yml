name: agentgateway-image-mcp CI

on:
  pull_request:
    paths:
      - "apps/agentgateway-image-mcp/**"
      - ".github/workflows/agentgateway-image-mcp.yml"
  push:
    branches: [main]
    paths:
      - "apps/agentgateway-image-mcp/**"
      - ".github/workflows/agentgateway-image-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/agentgateway-image-mcp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --disable-pip -r apps/agentgateway-image-mcp/requirements.txt --progress-spinner off
      - name: Install image transport tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo gettext-base
      - name: Check HTTP client and deployment scripts
        working-directory: apps/agentgateway-image-mcp
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          npm test
          bash -n deploy/release.sh
          bash -n deploy/publish.sh
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and test amd64 and arm64 images
        run: |
          version="v1.0.0-${GITHUB_SHA:0:12}"
          mkdir -p deploy/images
          archive="deploy/images/agentgateway-image-mcp-$version-multiarch.tar"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false --tag "agentgateway-image-mcp:$version" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=oci,dest=$archive" apps/agentgateway-image-mcp
          skopeo inspect --raw "oci-archive:$archive" |
            python3 apps/agentgateway-image-mcp/deploy/inspect_index.py
          for arch in amd64 arm64; do
            image="agentgateway-image-mcp:$version-$arch"
            container="image-mcp-check-$arch"
            skopeo copy --override-os linux --override-arch "$arch" \
              "oci-archive:$archive" "docker-daemon:$image"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$arch"
            docker run --rm --pull=never --platform "linux/$arch" \
              --entrypoint python "$image" -m unittest -v
            docker run -d --pull=never --platform "linux/$arch" --name "$container" \
              --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp \
              -e MCP_UPSTREAM_AUTHORIZATION='Bearer ci-only' -p 8000:8000 "$image"
            trap 'docker logs "$container"; docker rm -f "$container"' EXIT
            # Python startup under arm64 emulation can exceed ten seconds.
            curl --retry 60 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
              --connect-timeout 2 --max-time 5 --fail http://localhost:8000/healthz
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp)" = 401
            docker rm -f "$container"
            trap - EXIT
          done
      - name: Push tested image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v1.0.0-${GITHUB_SHA:0:12}"
          archive="deploy/images/agentgateway-image-mcp-$version-multiarch.tar"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentgateway-image-mcp"
          image="$repository:$version"
          digest="$(skopeo inspect --raw "oci-archive:$archive" |
            python3 apps/agentgateway-image-mcp/deploy/inspect_index.py)"
          auth_dir="$(mktemp -d)"
          authfile="$auth_dir/auth.json"
          trap 'rm -f "$authfile"; rmdir "$auth_dir"' EXIT
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$authfile" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          if skopeo inspect --authfile "$authfile" --raw "docker://$image" > deploy/images/existing-index.json 2>/dev/null; then
            test "$(python3 apps/agentgateway-image-mcp/deploy/inspect_index.py < deploy/images/existing-index.json)" = "$digest" ||
              { echo "Refusing to overwrite a different image tag" >&2; exit 1; }
          else
            skopeo copy --all --authfile "$authfile" --preserve-digests \
              "oci-archive:$archive" "docker://$image"
          fi
          test "$(skopeo inspect --authfile "$authfile" --raw "docker://$image" |
            python3 apps/agentgateway-image-mcp/deploy/inspect_index.py)" = "$digest"
          rm -f deploy/images/existing-index.json
          printf '%s@%s\n' "$repository" "$digest" > deploy/images/image.txt
          printf 'Image: `%s`\n\nPinned image: `%s@%s`\n' "$image" "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
          cd deploy/images
          sha256sum -- *.tar image.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: agentgateway-image-mcp-multiarch
          path: deploy/images/
          compression-level: 0
          retention-days: 30
