# loom 告警规则（Prometheus 原生规则格式）。
# 使用 prometheus-operator 时，把 groups 原样放进 PrometheusRule 的 spec.groups。
# 指标说明见 docs/loom-extauth-billing.md；阈值按自用规模给出，接入前按实际流量调整。
groups:
  - name: loom-availability
    rules:
      - alert: LoomDown
        expr: sum(up{job="loom"}) < 1 or absent(up{job="loom"})
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 没有可用的 loom 实例；extAuth 为 FailClosed，所有模型请求都会被拒绝。

      - alert: LoomAdmissionInternalErrors
        expr: sum(rate(loom_admission_decisions_total{reason="internal_error"}[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 准入出现 internal_error（通常是 PG 不可用或超时），调用方收到 500。

      - alert: LoomStoreErrors
        expr: sum by (op) (rate(loom_store_errors_total[5m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'PG 操作 {{ $labels.op }} 持续报错。'

      - alert: LoomCacheSyncReconnecting
        expr: sum(increase(loom_cache_sync_reconnects_total[10m])) > 2
        labels: {severity: warning}
        annotations:
          summary: 跨副本缓存失效的 LISTEN 连接反复断开；断开期间其他副本的修改要等缓存 TTL 才生效。

      - alert: LoomStorePoolSaturated
        expr: max(loom_store_pool_acquired_conns / loom_store_pool_max_conns) > 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: PG 连接池使用率超过 90%，准入延迟会随排队上升。

  - name: loom-latency
    rules:
      - alert: LoomAdmissionLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(loom_admission_duration_seconds_bucket{stage="total"}[5m]))
          ) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 准入 p99 超过 100ms（压测基线：16 账户 64 并发约 100ms，单账户热点更高）。

      - alert: LoomDenyRatioHigh
        expr: |
          sum(rate(loom_admission_decisions_total{allowed="false"}[10m]))
            / sum(rate(loom_admission_decisions_total[10m])) > 0.2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 超过 20% 的请求被拒绝；按 reason 拆分查看是额度、凭据还是定价问题。

  - name: loom-billing
    rules:
      - alert: LoomSettleErrors
        expr: sum by (channel) (rate(loom_ledger_settle_errors_total[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.channel }} 通道结算失败，用量可能没有入账。'

      - alert: LoomReservationsExpired
        expr: increase(loom_ledger_reservations_expired_total[30m]) > 0
        labels: {severity: warning}
        annotations:
          summary: 有预扣在 reservation_ttl 内没有收到任何用量上报，被释放且未计费（RLS 与 OTLP 都未送达）。

      - alert: LoomReserveCompensationFailed
        expr: sum(increase(loom_ledger_reserve_compensations_total{result="failed"}[30m])) > 0
        labels: {severity: warning}
        annotations:
          summary: >-
            提交结果未知的预扣补偿释放失败（PG 30s 内未恢复），这些额度冻结到 reservation_ttl 后由 reaper 释放；
            期间受影响账户的可用额度偏少。

      - alert: LoomMaintenanceFailing
        expr: sum by (task) (increase(loom_maintenance_runs_total{result="error"}[1h])) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: >-
            维护任务 {{ $labels.task }} 持续失败；partitions 失败超过分区余量（默认 3 个月）后新数据将无法写入，
            rollup 失败时明细不会被清理。

      - alert: LoomMaintenanceStale
        expr: max by (task) (time() - loom_maintenance_last_success_timestamp_seconds) > 6 * 3600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 维护任务 {{ $labels.task }} 超过 6 小时没有完成（任何副本都没有执行成功）。

      - alert: LoomOTLPDropping
        expr: sum(rate(loom_otlp_dropped_total[5m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: OTLP 补账队列持续丢弃；上游报错请求的预扣释放依赖 OTLP，丢弃会导致预扣冻结到 reservation_ttl。

      - alert: LoomCostMismatch
        expr: sum by (model) (increase(loom_ledger_cost_mismatch_total[1h])) > 0
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.model }} 的 loom 金额与网关金额（已乘分组倍率）不一致，检查 pricing.yaml 与网关 catalog 是否同源。'

      - alert: LoomPricingReloadFailing
        expr: sum(increase(loom_pricing_reloads_total{result="error"}[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: pricing.yaml 热加载失败，仍在使用上一版价目表；用 loom check-config 定位错误字段。
