# 真实上游验证：loom-gateway 直连火山方舟按量付费接口（OpenAI 兼容 /api/v3/chat/completions）。
# 不在 deploy.sh 的默认清单里；用 deploy/real/run.sh 单独应用与验证。
# 上游凭据 Secret ark-upstream-key（键 Authorization，值 "Bearer <ARK_KEY>"）由 run.sh 从安全来源写入，不入库。
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ark-payg
  namespace: loom
spec:
  ai:
    groups:
    - providers:
      - name: ark-payg
        host: ark.cn-beijing.volces.com
        port: 443
        path: /api/v3/chat/completions
        openai: {}            # 不指定 model：沿用调用方请求体里的方舟模型 ID
        policies:
          tls:
            sni: ark.cn-beijing.volces.com
          auth:
            secretRef:
              name: ark-upstream-key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ark-chat
  namespace: loom
spec:
  parentRefs:
  - name: loom-gateway
  rules:
  - matches:
    - path: {type: PathPrefix, value: /ark/v1/chat/completions}
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: ark-payg
---
# 与 mock 路由 llm 相同的 extAuth + RLS 结算策略
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ark-chat-ext-auth
  namespace: loom
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ark-chat
  traffic:
    extAuth:
      backendRef:
        name: loom
        port: 8080
      forwardBody:
        maxSize: 1Mi
      http:
        path: '"/check"'
        allowedRequestHeaders: [authorization, x-api-key, x-request-id, content-type]
        allowedResponseHeaders: [x-loom-client-id, x-loom-key-id, x-loom-request-id, x-loom-quota-remaining, x-loom-deny-reason, x-loom-model]
      failureMode: FailClosed
    headerModifiers:
      request:
        remove: [authorization, x-api-key]
    # 同步结算通道：响应完成后网关按 cost CEL（已归一化的 token 数）回调 loom :8080（RateLimitService amend），与 OTLP 补账共用 request_id 幂等。
    # completion 描述符恒为 1，标记"该请求已有结论"，没有 token 用量的失败请求也由 RLS 结算。
    # 请求阶段的 check 调用 hits_addend=0，loom 恒返回 OK；额度门禁由 extAuth 负责，所以这里 FailOpen。
    rateLimit:
      global:
        domain: loom-billing
        failureMode: FailOpen
        backendRef: {name: loom, port: 8080}
        descriptors:
        - unit: Tokens
          entries:
          - {name: request_id, expression: 'request.headers["x-loom-request-id"]'}
          - {name: key_id, expression: 'request.headers["x-loom-key-id"]'}
          - {name: model, expression: 'request.headers["x-loom-model"]'}
          - {name: kind, expression: '"input"'}
          cost: 'llm.inputTokens'
        - unit: Tokens
          entries:
          - {name: request_id, expression: 'request.headers["x-loom-request-id"]'}
          - {name: key_id, expression: 'request.headers["x-loom-key-id"]'}
          - {name: model, expression: 'request.headers["x-loom-model"]'}
          - {name: kind, expression: '"cached"'}
          cost: 'llm.cachedInputTokens'
        - unit: Tokens
          entries:
          - {name: request_id, expression: 'request.headers["x-loom-request-id"]'}
          - {name: key_id, expression: 'request.headers["x-loom-key-id"]'}
          - {name: model, expression: 'request.headers["x-loom-model"]'}
          - {name: kind, expression: '"output"'}
          cost: 'llm.outputTokens'
        # 恒为 1：让上游报错、客户端中途断开（token 用量为 0）的请求也能经 RLS 立即结算并释放预扣，不依赖 OTLP
        - unit: Tokens
          entries:
          - {name: request_id, expression: 'request.headers["x-loom-request-id"]'}
          - {name: key_id, expression: 'request.headers["x-loom-key-id"]'}
          - {name: model, expression: 'request.headers["x-loom-model"]'}
          - {name: kind, expression: '"completion"'}
          cost: '1'
        # 上游响应状态码：区分上游报错（4xx/5xx，不计费）与流在最后的 usage chunk 前被中断（2xx 却没有用量）。
        # 流式结算的 CEL 上下文没有 response，而网关只对 2xx 响应走流式结算，所以缺省为 200。
        - unit: Tokens
          entries:
          - {name: request_id, expression: 'request.headers["x-loom-request-id"]'}
          - {name: key_id, expression: 'request.headers["x-loom-key-id"]'}
          - {name: model, expression: 'request.headers["x-loom-model"]'}
          - {name: kind, expression: '"status"'}
          cost: 'default(response.code, 200)'
        # 用量是否由网关估算（provider 开启 tokenize 时，流在 usage chunk 前中断由网关计数补上）；旧版网关没有该字段，按 0
        - unit: Tokens
          entries:
          - {name: request_id, expression: 'request.headers["x-loom-request-id"]'}
          - {name: key_id, expression: 'request.headers["x-loom-key-id"]'}
          - {name: model, expression: 'request.headers["x-loom-model"]'}
          - {name: kind, expression: '"estimated"'}
          cost: 'default(llm.usageEstimated, false) ? 1 : 0'
    # 上游 429/5xx 重试 4 次，100ms backoff
    retry:
      attempts: 4
      backoff: 100ms
      codes: [429, 500, 502, 503, 504]
