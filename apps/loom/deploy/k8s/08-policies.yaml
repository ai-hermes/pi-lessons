# 图片路由：按次计费；每客户端（x-loom-client-id）10 rpm、burst 2
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: media-ext-auth
  namespace: loom
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: media
  traffic:
    extAuth:
      backendRef: {name: loom, port: 9001}
      forwardBody: {maxSize: 1Mi}
      http:
        path: '"/check"'
        allowedRequestHeaders: [authorization, x-api-key, x-request-id, content-type]
        allowedResponseHeaders: [x-loom-client-id, x-loom-key-id, x-loom-request-id, x-loom-quota-remaining, x-loom-deny-reason, x-loom-model]
      failureMode: FailClosed
    headerModifiers:
      request:
        remove: [authorization, x-api-key]
    rateLimit:
      local:
      - requests: 10
        unit: Minutes
        burst: 2
        key: 'request.headers["x-loom-client-id"]'
---
