# /echo：HTTP 门面；请求体不是 JSON，loom 不定价不预扣，只做鉴权
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: echo-ext-auth
  namespace: loom
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo
  traffic:
    extAuth:
      backendRef: {name: loom, port: 8080}
      http:
        path: '"/check"'
        allowedRequestHeaders: [authorization, x-api-key, x-request-id]
        allowedResponseHeaders: [x-loom-client-id, x-loom-key-id, x-loom-request-id, x-loom-quota-remaining, x-loom-deny-reason, x-loom-model]
      failureMode: FailClosed
    headerModifiers:
      request:
        remove: [authorization, x-api-key]
---
# /grpc：Envoy ext_authz.v3 gRPC 门面，同一决策引擎
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: grpc-echo-ext-auth
  namespace: loom
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: grpc-echo
  traffic:
    extAuth:
      backendRef: {name: loom, port: 8080}
      grpc:
        contextExtensions:
          loom.route: grpc-echo
      failureMode: FailClosed
    headerModifiers:
      request:
        remove: [authorization, x-api-key]
