# loom 本体：2 副本 + PDB。两个端口：
#   data :8080（h2c）— 网关调用的 extauth HTTP /check 与 gRPC ext_authz、RateLimitService 结算、OTLP 补账
#   ops  :9090       — 管理 API /v1、/metrics、/healthz、/readyz、pprof（不对网关开放）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom
  namespace: loom
  labels:
    app: loom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loom
  template:
    metadata:
      labels:
        app: loom
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: loom
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: loom
      containers:
      - name: loom
        image: loom/loom:IMAGE_TAG
        imagePullPolicy: IfNotPresent
        args: ["serve", "--config", "/etc/loom/config.yaml"]
        ports:
        - {name: data, containerPort: 8080}
        - {name: ops, containerPort: 9090}
        env:
        - name: LOOM_LOG_LEVEL
          value: info
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        readinessProbe:
          httpGet: {path: /readyz, port: ops}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: ops}
          periodSeconds: 10
        startupProbe:
          httpGet: {path: /healthz, port: ops}
          failureThreshold: 20
          periodSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/loom
          readOnly: true
      volumes:
      - name: config
        projected:
          sources:
          - configMap: {name: loom-config}
          - configMap: {name: loom-pricing}
          - secret: {name: loom-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: loom
  namespace: loom
  labels:
    app: loom
spec:
  selector:
    app: loom
  ports:
  - {name: data, port: 8080, targetPort: data}
  - {name: ops, port: 9090, targetPort: ops}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loom
  namespace: loom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: loom
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom
  namespace: loom
---
