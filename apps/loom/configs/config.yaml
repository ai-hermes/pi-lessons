# loom 运行配置（K8s 中由 ConfigMap loom-config 挂载为 /etc/loom/config.yaml）。
# 环境变量覆盖：LOOM_<节>_<键>，例如 LOOM_LOG_LEVEL=debug；更深层级用双下划线：
# LOOM_LEDGER__RESERVE_TOKENS__INPUT=512。敏感项只用 *_file 或环境变量，不写在这里。

server:
  listen: ":8080"        # 数据面（h2c）：extauth HTTP /check + gRPC ext_authz、ratelimit、OTLP，仅供网关调用
  ops_listen: ":9090"    # 运维面：管理 API /v1、/metrics、/healthz、/readyz、/debug/pprof
  shutdown_timeout: 15s

log:
  level: info
  format: json

postgres:
  dsn_file: /etc/loom/pg-dsn
  # listen_dsn: 跨副本缓存失效用 LISTEN 长连接；主 DSN 经过事务模式连接池（PgBouncer 等）时指向可直连的地址
  min_conns: 2
  max_conns: 20
  max_conn_lifetime: 30m
  statement_timeout: 5s

migrations:
  auto: true

admission:
  key_cache:
    enabled: true
    size: 10000
    ttl: 5s              # 停用 Key 最迟 ttl 后在所有副本生效（管理 API 只会清当前副本的缓存）
    negative_ttl: 5s
  audit_queue: 4096

extauth:
  credential_headers: [authorization, x-api-key]   # Bearer <key> 或裸 key，按顺序取第一个
  headers:                                          # 对外契约：需与网关策略的 allowed*Headers 一致
    client_request_id: x-request-id
    model: x-loom-model
    account: x-loom-client-id
    key_id: x-loom-key-id
    request_id: x-loom-request-id
    quota_remaining: x-loom-quota-remaining
    deny_reason: x-loom-deny-reason
  deny_status:
    missing_credential: 401
    unknown_api_key: 401
    expired_api_key: 401
    client_inactive: 403
    model_not_allowed: 403
    model_not_priced: 403
    group_not_priced: 403
    insufficient_quota: 403
    internal_error: 500
  body_limit: 1048576

pricing:
  file: /etc/loom/pricing.yaml
  reload_interval: 30s
  store_fallback: true          # pricing.yaml 没有的模型查 PG model_pricing

ledger:
  reserve_tokens:               # 准入预扣估值：input × 输入单价 + output × 输出单价
    input: 1024
    output: 1024
  reservation_ttl: 15m          # 两条用量通道都没送达时，预扣在此之后释放
  reaper_interval: 1m
  reaper_batch: 200
  cost_source: loom             # loom：以计价表为准；gateway_prefer：优先网关 agw.ai.usage.cost.total × 分组倍率
  owner_cache_ttl: 60s

ratelimit:
  domain: loom-billing          # 需与网关策略 rateLimit.global.domain 一致

otlp:
  protocols: []                 # 空 = 不过滤；只结算 LLM 流量可填 [llm]
  queue_size: 4096
  batch_size: 200
  flush_interval: 2s
  attributes:
    input_tokens: gen_ai.usage.input_tokens
    output_tokens: gen_ai.usage.output_tokens
    cached_tokens: gen_ai.usage.cache_read.input_tokens
    gateway_cost: agw.ai.usage.cost.total
    model: gen_ai.request.model
    loom_model: loom.model
    provider: gen_ai.provider.name
    protocol: protocol
    route: route
    gateway: gateway
    request_id: loom.request.id
    key_id: loom.key.id
    account: loom.client.id

admin:
  token_file: /etc/loom/admin-token
  key_prefix: loom-
