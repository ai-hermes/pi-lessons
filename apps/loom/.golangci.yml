# golangci-lint v2：固化命名、错误处理、行宽等约定，防止回退。
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint     # errors.Is / errors.As，禁止直接比较错误
    - errname       # 哨兵错误 ErrXxx、错误类型 XxxError
    - revive        # 命名、导出符号注释、receiver 一致性
    - gocritic
    - misspell
    - bodyclose
    - nolintlint
    - lll
  settings:
    lll:
      line-length: 120
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
        - name: receiver-naming
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: unused-parameter
    gocritic:
      enabled-tags: [diagnostic, style]
      disabled-checks: [commentFormatting, unnamedResult]
  exclusions:
    generated: strict
    paths:
      - internal/store/sqlcgen
    rules:
      - path: _test\.go
        linters: [lll, revive]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/ai-hermes/pi-lessons/apps/loom]
