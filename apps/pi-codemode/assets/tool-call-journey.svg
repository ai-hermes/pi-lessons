<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" font-family="PingFang SC, Hiragino Sans GB, -apple-system, Helvetica, sans-serif">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1b2a24" flood-opacity="0.08"/>
  </filter>
  <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8a948f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c2621b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .t  { font-size: 15px; font-weight: 600; fill: #1f2422; }
    .d  { font-size: 12px; fill: #6b716e; }
    .c  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #33403b; }
    .n  { font-size: 12px; font-weight: 700; fill: #fff; }
    .card { fill: #fff; stroke: #e6e3dc; }
    .code { fill: #f5f3ee; }
  </style>
</defs>

<rect width="1080" height="630" fill="#fbfaf7"/>

<!-- 标题 -->
<text x="30" y="48" font-size="24" font-weight="700" fill="#1f2422">一次工具调用的完整旅程</text>
<text x="30" y="76" font-size="13" fill="#7a807d">VM 只负责“发出”，宿主异步执行，结果 settle 回 pending 表，再由 drain() 推进脚本继续往下跑</text>

<!-- ===== VM 泳道 ===== -->
<rect x="30" y="104" width="1020" height="208" rx="16" fill="#eef5f1" stroke="#d6e7de"/>
<circle cx="54" cy="130" r="4" fill="#1f6f5c"/>
<text x="66" y="134.5" font-size="13" font-weight="700" fill="#1f6f5c" letter-spacing="0.5">VM 内 · QuickJS WASM</text>
<text x="1030" y="134.5" text-anchor="end" font-size="12" fill="#7fa797">单线程 · 没有事件循环</text>

<!-- 1 -->
<g filter="url(#shadow)"><rect class="card" x="60" y="152" width="290" height="136" rx="12"/></g>
<circle cx="84" cy="178" r="11" fill="#1f6f5c"/><text class="n" x="84" y="182.5" text-anchor="middle">1</text>
<text class="t" x="104" y="183.5">脚本调用工具</text>
<rect class="code" x="76" y="198" width="258" height="46" rx="6"/>
<text class="c" x="88" y="217">await tools.mcp__dev_radius__search(</text>
<text class="c" x="88" y="234" xml:space="preserve">  { query: "codemode" })</text>
<text class="d" x="76" y="268">在脚本眼里，就是一次普通的 await</text>

<!-- 2 -->
<g filter="url(#shadow)"><rect class="card" x="395" y="152" width="290" height="136" rx="12"/></g>
<circle cx="419" cy="178" r="11" fill="#1f6f5c"/><text class="n" x="419" y="182.5" text-anchor="middle">2</text>
<text class="t" x="439" y="183.5">caller() 包装调用</text>
<rect class="code" x="411" y="198" width="258" height="46" rx="6"/>
<text class="c" x="423" y="217">const id = nextId++</text>
<text class="c" x="423" y="234">pending.set(id, {resolve, reject})</text>
<text class="d" x="411" y="268">序列化参数 → 分配 id → 返回 Promise</text>

<!-- 3 -->
<g filter="url(#shadow)"><rect x="730" y="152" width="290" height="136" rx="12" fill="#fff" stroke="#c2621b" stroke-width="1.6"/></g>
<circle cx="754" cy="178" r="11" fill="#c2621b"/><text class="n" x="754" y="182.5" text-anchor="middle">3</text>
<text class="t" x="774" y="183.5">bridge 发出调用</text>
<rect x="746" y="198" width="258" height="46" rx="6" fill="#fbf1e8"/>
<text class="c" x="758" y="226">bridge("call", id, name, json)</text>
<text class="d" x="746" y="268">VM 的唯一出口，发出去立即返回</text>

<line x1="356" y1="220" x2="389" y2="220" stroke="#8a948f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"/>
<line x1="691" y1="220" x2="724" y2="220" stroke="#8a948f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"/>

<!-- ===== 宿主泳道 ===== -->
<rect x="30" y="400" width="1020" height="208" rx="16" fill="#f4f1eb" stroke="#e5dfd3"/>
<circle cx="54" cy="426" r="4" fill="#2b2b2b"/>
<text x="66" y="430.5" font-size="13" font-weight="700" fill="#2b2b2b" letter-spacing="0.5">宿主 · Node / Worker</text>
<text x="66" y="482" font-size="13" font-weight="600" fill="#5c564b">为什么要绕一圈？</text>
<text x="66" y="508" font-size="12" fill="#8a8274">· VM 里没有 I/O，真正的工具执行</text>
<text x="76" y="526" font-size="12" fill="#8a8274">只能交给宿主</text>
<text x="66" y="550" font-size="12" fill="#8a8274">· 宿主执行期间 VM 不阻塞，</text>
<text x="76" y="568" font-size="12" fill="#8a8274">Promise.all 可以并发多个调用</text>

<!-- 5 -->
<g filter="url(#shadow)"><rect class="card" x="395" y="448" width="290" height="136" rx="12"/></g>
<circle cx="419" cy="474" r="11" fill="#2b2b2b"/><text class="n" x="419" y="478.5" text-anchor="middle">5</text>
<text class="t" x="439" y="479.5">host.ts handleCall</text>
<rect class="code" x="411" y="494" width="258" height="46" rx="6"/>
<text class="c" x="423" y="522">await tool.execute(args, { signal })</text>
<text class="d" x="411" y="564">→ coding-agent 适配层 ctx.executeTool</text>

<!-- 4 -->
<g filter="url(#shadow)"><rect class="card" x="730" y="448" width="290" height="136" rx="12"/></g>
<circle cx="754" cy="474" r="11" fill="#2b2b2b"/><text class="n" x="754" y="478.5" text-anchor="middle">4</text>
<text class="t" x="774" y="479.5">worker.ts</text>
<rect class="code" x="746" y="494" width="258" height="46" rx="6"/>
<text class="c" x="758" y="522">parentPort.postMessage(msg)</text>
<text class="d" x="746" y="564">统一转发 call / global / output / done</text>

<line x1="724" y1="516" x2="691" y2="516" stroke="#8a948f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"/>

<!-- 3 → 4：postMessage -->
<line x1="875" y1="294" x2="875" y2="440" stroke="#c2621b" stroke-width="2" stroke-linecap="round" marker-end="url(#ao)"/>
<rect x="890" y="342" width="104" height="26" rx="13" fill="#fff" stroke="#efc9ab"/>
<text x="942" y="359.5" text-anchor="middle" font-size="12" font-weight="600" fill="#c2621b">postMessage</text>

<!-- 5 → 2：settle + drain -->
<line x1="540" y1="440" x2="540" y2="294" stroke="#c2621b" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ao)"/>
<rect x="196" y="328" width="328" height="56" rx="10" fill="#fff" stroke="#efc9ab"/>
<circle cx="216" cy="346" r="8" fill="#c2621b"/><text x="216" y="350" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">6</text>
<text x="231" y="350.5" font-size="12" fill="#5a3a22"><tspan class="c" fill="#c2621b">settle(id, ok, payload)</tspan>  回写 pending</text>
<circle cx="216" cy="368" r="8" fill="#c2621b"/><text x="216" y="372" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">7</text>
<text x="231" y="372.5" font-size="12" fill="#5a3a22"><tspan class="c" fill="#c2621b">drain()</tspan>  executePendingJobs + stalled 检查</text>
</svg>
