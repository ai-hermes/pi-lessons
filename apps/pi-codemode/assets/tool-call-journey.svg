<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="PingFang SC, Hiragino Sans GB, Helvetica, sans-serif">
<defs>
  <marker id="ablk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  <marker id="aorg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8560f"/></marker>
</defs>
<rect width="1000" height="490" fill="#fbfaf7"/>

<!-- 标题 -->
<text x="22" y="36" font-size="22" font-weight="bold" fill="#222">一次工具调用的完整旅程：VM 发出，宿主执行，settle 回来</text>
<line x1="22" y1="54" x2="980" y2="54" stroke="#ddd8cf" stroke-width="1.2"/>

<!-- VM 区域 -->
<rect x="20" y="72" width="962" height="194" fill="#ebf0ed"/>
<rect x="20" y="72" width="3.5" height="194" fill="#1f5f50"/>
<text x="38" y="102" font-size="13.5" font-weight="bold" fill="#1f5f50" letter-spacing="0.3">VM 内 · QUICKJS WASM</text>

<!-- 1 脚本调用工具 -->
<rect x="55" y="114" width="267" height="124" fill="#fff" stroke="#ddd8cf"/>
<circle cx="79" cy="140" r="11" fill="#1f5f50"/><text x="79" y="144.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">1</text>
<text x="100" y="145.5" font-size="15" font-weight="bold" fill="#222">脚本调用工具</text>
<text x="68" y="173" font-size="12" fill="#777">await tools</text>
<text x="68" y="194" font-size="12" fill="#777">.mcp__dev_radius__search(</text>
<text x="68" y="215" font-size="12" fill="#777">{ query: "codemode" })</text>

<!-- 2 caller() 包装调用 -->
<rect x="380" y="114" width="278" height="124" fill="#fff" stroke="#ddd8cf"/>
<circle cx="404" cy="140" r="11" fill="#1f5f50"/><text x="404" y="144.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">2</text>
<text x="425" y="145.5" font-size="15" font-weight="bold" fill="#222">caller() 包装调用</text>
<text x="393" y="173" font-size="12" fill="#666">serialize 参数 → 分配 id →</text>
<text x="393" y="194" font-size="12" fill="#777">pending.set(id, {resolve, reject})</text>
<text x="393" y="215" font-size="12" fill="#555">返回 Promise，不阻塞</text>

<!-- 3 bridge 发出调用 -->
<rect x="716" y="114" width="248" height="124" fill="#fff" stroke="#b8560f" stroke-width="2"/>
<circle cx="740" cy="140" r="11" fill="#b8560f"/><text x="740" y="144.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">3</text>
<text x="761" y="145.5" font-size="15" font-weight="bold" fill="#222">bridge 发出调用</text>
<text x="729" y="173" font-size="12" fill="#777">bridge("call", id,</text>
<text x="733" y="194" font-size="12" fill="#777">name, json)</text>
<text x="729" y="215" font-size="12" fill="#666">唯一出口，发出去即返回</text>

<line x1="330" y1="176" x2="375" y2="176" stroke="#222" stroke-width="1.3" marker-end="url(#ablk)"/>
<line x1="666" y1="176" x2="711" y2="176" stroke="#222" stroke-width="1.3" marker-end="url(#ablk)"/>

<!-- 宿主区域 -->
<rect x="20" y="314" width="962" height="150" fill="#f3efe9"/>
<rect x="20" y="314" width="3.5" height="150" fill="#222"/>
<text x="38" y="344" font-size="13.5" font-weight="bold" fill="#222" letter-spacing="0.3">宿主 · NODE / WORKER</text>

<!-- 5 host.ts handleCall -->
<rect x="380" y="350" width="278" height="94" fill="#fff" stroke="#ddd8cf"/>
<circle cx="404" cy="372" r="11" fill="#222"/><text x="404" y="376.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">5</text>
<text x="425" y="377.5" font-size="15" font-weight="bold" fill="#222">host.ts handleCall</text>
<text x="393" y="404" font-size="12" fill="#777">tool.execute(args, {signal})</text>
<text x="393" y="425" font-size="12" fill="#555">→ coding-agent 适配层 ctx.executeTool</text>

<!-- 4 worker.ts -->
<rect x="716" y="350" width="248" height="94" fill="#fff" stroke="#ddd8cf"/>
<circle cx="740" cy="372" r="11" fill="#222"/><text x="740" y="376.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">4</text>
<text x="761" y="377.5" font-size="15" font-weight="bold" fill="#222">worker.ts</text>
<text x="729" y="404" font-size="12" fill="#666">bridge 处理 call / global / output /</text>
<text x="729" y="425" font-size="12" fill="#666">done，统一 postMessage 给 host</text>

<line x1="708" y1="397" x2="663" y2="397" stroke="#222" stroke-width="1.3" marker-end="url(#ablk)"/>

<!-- 3 → 4 postMessage -->
<line x1="840" y1="242" x2="840" y2="344" stroke="#b8560f" stroke-width="1.6" marker-end="url(#aorg)"/>
<text x="854" y="288" font-size="12" fill="#b8560f">postMessage</text>

<!-- 5 → 2 settle / drain -->
<line x1="519" y1="346" x2="519" y2="243" stroke="#b8560f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aorg)"/>
<text x="534" y="283" font-size="12.5" font-weight="bold" fill="#b8560f">6  settle(id, ok, payload) 回写 pending</text>
<text x="534" y="305" font-size="12.5" font-weight="bold" fill="#b8560f">7  drain()：executePendingJobs() + stalled() 检查</text>
</svg>
