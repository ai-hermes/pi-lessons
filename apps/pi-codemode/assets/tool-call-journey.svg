<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="640" viewBox="0 0 1760 640" font-family="PingFang SC, Hiragino Sans GB, -apple-system, Helvetica, sans-serif">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1b2a24" flood-opacity="0.08"/>
  </filter>
  <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8a948f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c2621b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f6db5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .t  { font-size: 15px; font-weight: 600; fill: #1f2422; }
    .d  { font-size: 12px; fill: #6b716e; }
    .c  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #33403b; }
    .n  { font-size: 12px; font-weight: 700; fill: #fff; }
    .card { fill: #fff; stroke: #e6e3dc; }
    .code { fill: #f5f3ee; }
    .note { font-size: 12px; fill: #7d8580; }
    .noteh { font-size: 13px; font-weight: 600; fill: #4f5753; }
  </style>
</defs>

<rect width="1760" height="640" fill="#fbfaf7"/>

<!-- 标题 -->
<text x="30" y="48" font-size="24" font-weight="700" fill="#1f2422">一次工具调用的完整旅程</text>
<text x="30" y="76" font-size="13" fill="#7a807d">VM 与 worker.js 同在 Worker 线程，bridge 是同步回调；真正跨线程的只有 postMessage，请求和结果靠 id 配对</text>

<!-- ================= Worker 线程 ================= -->
<rect x="30" y="100" width="1020" height="500" rx="18" fill="#f1f5fa" stroke="#d5e1ef"/>
<circle cx="54" cy="125" r="4" fill="#2f6db5"/>
<text x="66" y="129.5" font-size="13" font-weight="700" fill="#2f6db5" letter-spacing="0.5">Worker 线程 · worker.js</text>
<text x="1030" y="129.5" text-anchor="end" font-size="12" fill="#86a3c6">每次 execute() 新建一个 Worker + VM</text>

<!-- VM 子泳道 -->
<rect x="50" y="144" width="980" height="196" rx="14" fill="#eef5f1" stroke="#d6e7de"/>
<circle cx="72" cy="165" r="4" fill="#1f6f5c"/>
<text x="84" y="169.5" font-size="12.5" font-weight="700" fill="#1f6f5c" letter-spacing="0.5">QuickJS VM（WASM）</text>
<text x="1012" y="169.5" text-anchor="end" font-size="12" fill="#7fa797">脚本只看得到 tools.*，看不到 bridge</text>

<!-- 1 -->
<g filter="url(#shadow)"><rect class="card" x="70" y="184" width="290" height="140" rx="12"/></g>
<circle cx="94" cy="210" r="11" fill="#1f6f5c"/><text class="n" x="94" y="214.5" text-anchor="middle">1</text>
<text class="t" x="114" y="215.5">脚本调用工具</text>
<rect class="code" x="86" y="230" width="258" height="46" rx="6"/>
<text class="c" x="98" y="249">await tools.mcp__dev_radius__search(</text>
<text class="c" x="98" y="266" xml:space="preserve">  { query: "codemode" })</text>
<text class="d" x="86" y="304">在脚本眼里，就是一次普通的 await</text>

<!-- 2 -->
<g filter="url(#shadow)"><rect class="card" x="395" y="184" width="290" height="140" rx="12"/></g>
<circle cx="419" cy="210" r="11" fill="#1f6f5c"/><text class="n" x="419" y="214.5" text-anchor="middle">2</text>
<text class="t" x="439" y="215.5">prelude caller() 包装</text>
<rect class="code" x="411" y="230" width="258" height="46" rx="6"/>
<text class="c" x="423" y="249">const id = nextId++</text>
<text class="c" x="423" y="266">pending.set(id, {resolve, reject})</text>
<text class="d" x="411" y="304">序列化参数 → 分配 id → 返回 Promise</text>

<!-- 3 -->
<g filter="url(#shadow)"><rect class="card" x="720" y="184" width="290" height="140" rx="12"/></g>
<circle cx="744" cy="210" r="11" fill="#1f6f5c"/><text class="n" x="744" y="214.5" text-anchor="middle">3</text>
<text class="t" x="764" y="215.5">调用闭包里的 bridge</text>
<rect class="code" x="736" y="230" width="258" height="46" rx="6"/>
<text class="c" x="748" y="258">bridge("call", id, name, json)</text>
<text class="d" x="736" y="304">VM 的唯一出口，调用后立即返回</text>

<line x1="366" y1="253" x2="389" y2="253" stroke="#8a948f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"/>
<line x1="691" y1="253" x2="714" y2="253" stroke="#8a948f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"/>

<!-- worker.ts 行 -->
<text class="noteh" x="70" y="392">为什么要单独开 Worker？</text>
<text class="note" x="70" y="418">· 脚本死循环也卡不住主线程</text>
<text class="note" x="70" y="442">· 超时/取消：主线程写 SharedArrayBuffer，</text>
<text class="note" x="80" y="460">VM 的 interruptHandler 用 Atomics 读到</text>
<text class="note" x="80" y="478">就中断，必要时 worker.terminate()</text>

<!-- 6/7 -->
<g filter="url(#shadow)"><rect class="card" x="395" y="364" width="290" height="148" rx="12"/></g>
<circle cx="419" cy="390" r="11" fill="#2f6db5"/><text class="n" x="419" y="394.5" text-anchor="middle">6</text>
<text class="t" x="439" y="395.5">on("message") 收到结果</text>
<rect class="code" x="411" y="410" width="258" height="46" rx="6"/>
<text class="c" x="423" y="429">settle(id, ok, payload)</text>
<text class="c" x="423" y="446">drain()  // executePendingJobs</text>
<circle cx="419" cy="482" r="8" fill="#2f6db5"/><text x="419" y="486" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">7</text>
<text class="d" x="433" y="486">按 id 找到 Promise 并 resolve，</text>
<text class="d" x="433" y="503">drain 推进 await，并检查 stalled</text>

<!-- 4 -->
<g filter="url(#shadow)"><rect class="card" x="720" y="364" width="290" height="148" rx="12"/></g>
<circle cx="744" cy="390" r="11" fill="#2f6db5"/><text class="n" x="744" y="394.5" text-anchor="middle">4</text>
<text class="t" x="764" y="395.5">bridge 的宿主实现</text>
<rect class="code" x="736" y="410" width="258" height="46" rx="6"/>
<text class="c" x="748" y="429">vm.newFunction("bridge", …)</text>
<text class="c" x="748" y="446">  → post({ type: "call", … })</text>
<text class="d" x="736" y="486">同一线程内的同步函数调用，</text>
<text class="d" x="736" y="503">还没有跨线程</text>

<!-- 3 → 4 同步调用 -->
<line x1="865" y1="328" x2="865" y2="358" stroke="#8a948f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"/>
<text x="878" y="348" font-size="11.5" fill="#8a948f">同步调用</text>

<!-- 6 → 2 resolve -->
<line x1="540" y1="360" x2="540" y2="330" stroke="#2f6db5" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#ab)"/>
<text x="553" y="350" font-size="11.5" fill="#2f6db5">resolve → await 继续往下跑</text>

<!-- ================= 线程边界（竖线） ================= -->
<line x1="1100" y1="100" x2="1100" y2="600" stroke="#c9c3b8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="1100" y="624" text-anchor="middle" font-size="11.5" fill="#a39c90">线程边界：只能传可结构化克隆的消息</text>

<!-- ================= 主线程 ================= -->
<rect x="1150" y="100" width="580" height="500" rx="18" fill="#f4f1eb" stroke="#e5dfd3"/>
<circle cx="1174" cy="125" r="4" fill="#2b2b2b"/>
<text x="1186" y="129.5" font-size="13" font-weight="700" fill="#2b2b2b" letter-spacing="0.5">主线程 · host.js</text>

<text class="noteh" x="1174" y="170">为什么要绕一圈？</text>
<text class="note" x="1174" y="196">· VM 里没有 I/O，真正的工具只能在宿主执行</text>
<text class="note" x="1174" y="220">· 宿主执行期间 VM 不阻塞，Promise.all 可并发多个调用</text>

<!-- 5 -->
<g filter="url(#shadow)"><rect class="card" x="1170" y="250" width="540" height="310" rx="12"/></g>
<circle cx="1194" cy="278" r="11" fill="#2b2b2b"/><text class="n" x="1194" y="282.5" text-anchor="middle">5</text>
<text class="t" x="1214" y="283.5">handleMessage → handleCall：执行真正的工具</text>
<text class="d" x="1186" y="316">worker 发来的 3 种消息（args / value 都是 JSON 字符串）</text>
<rect class="code" x="1186" y="326" width="508" height="64" rx="6"/>
<text class="c" x="1196" y="346" xml:space="preserve"><tspan fill="#c2621b">case "call":</tspan>   post({ type: "call", id, target: "tool", name, args });</text>
<text class="c" x="1196" y="362" xml:space="preserve"><tspan fill="#c2621b">case "output":</tspan> post({ type: "output", item });</text>
<text class="c" x="1196" y="378" xml:space="preserve"><tspan fill="#c2621b">case "done":</tspan>   post({ type: "done", ok, value, writes });</text>
<text class="d" x="1186" y="420">收到 call → handleCall 执行工具，带同一个 id 回复</text>
<rect class="code" x="1186" y="430" width="508" height="48" rx="6"/>
<text class="c" x="1196" y="450">const value = await tool.execute(JSON.parse(args), { signal })</text>
<text class="c" x="1196" y="467">worker.postMessage({ type: "result", id, ok, payload })</text>
<text class="d" x="1186" y="510">失败时 ok = false；工具实际由 coding-agent 的 ctx.executeTool 执行</text>
<text class="d" x="1186" y="532">output → output.push(item)；done → finish()，execute() 返回结果</text>

<!-- 4 → 5 postMessage call -->
<line x1="1016" y1="420" x2="1164" y2="420" stroke="#c2621b" stroke-width="2" stroke-linecap="round" marker-end="url(#ao)"/>
<rect x="1030" y="386" width="140" height="26" rx="13" fill="#fff" stroke="#efc9ab"/>
<text x="1100" y="403.5" text-anchor="middle" font-size="12" font-weight="600" fill="#c2621b">postMessage · call</text>

<!-- 5 → 6 postMessage result -->
<polyline points="1164,540 540,540 540,518" fill="none" stroke="#c2621b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ao)"/>
<rect x="1025" y="552" width="150" height="26" rx="13" fill="#fff" stroke="#efc9ab"/>
<text x="1100" y="569.5" text-anchor="middle" font-size="12" font-weight="600" fill="#c2621b">postMessage · result</text>
</svg>
