<text x="770" y="545" text-anchor="middle" font-size="12.5" fill="#333">VM 拿到的是 pending 的 Promise</text>
<rect x="120" y="520" width="220" height="46" rx="5" fill="#fff0f0" stroke="#d93025"/>
<text x="230" y="539" text-anchor="middle" font-size="12.5" fill="#a02020">await Promise.all([...])</text>
<text x="230" y="557" text-anchor="middle" font-size="12.5" fill="#a02020">→ 脚本挂起</text>
<rect x="640" y="562" width="260" height="64" rx="5" fill="#fff" stroke="#bbb"/>
<text x="770" y="581" text-anchor="middle" font-size="12.5" fill="#333">drain(): executePendingJobs()</text>
<text x="770" y="599" text-anchor="middle" font-size="12.5" fill="#333">pending=2，不算卡死</text>
