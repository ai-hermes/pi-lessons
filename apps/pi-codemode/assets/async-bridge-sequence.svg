<text x="635" y="468" text-anchor="middle" font-size="12.5" fill="#e08a00" font-family="Menlo, monospace">bridge("call", 2, …)</text>
<line x1="776" y1="495" x2="1032" y2="495" stroke="#2e9e5b" stroke-width="1.8"  marker-end="url(#a2e9e5b)"/>
<text x="905" y="488" text-anchor="middle" font-size="12.5" fill="#2e9e5b" font-family="Menlo, monospace">启动 #2（不 await）</text>
