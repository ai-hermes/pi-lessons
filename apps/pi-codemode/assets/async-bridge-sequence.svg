<text x="770" y="755" text-anchor="middle" font-size="12.5" fill="#333">Promise.all 还在等 #2</text>
<text x="30" y="814" font-size="13" font-weight="bold" fill="#3b6fd8">209ms</text><line x1="80" y1="810" x2="1160" y2="810" stroke="#3b6fd8" stroke-opacity="0.15"/>
