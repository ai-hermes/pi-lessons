<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980" font-family="PingFang SC, Hiragino Sans GB, Helvetica, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08a00"/></marker>
  </defs>
  <rect width="1100" height="980" fill="#ffffff"/>
  <text x="550" y="36" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">Node 与 QuickJS wasm 的关系（quickjs-wasi@3.6.2）</text>

  <!-- 进程 -->
  <rect x="20" y="56" width="1060" height="700" rx="12" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="80" font-size="14" fill="#666">Node.js 进程 · 同一个线程（Pi 里是专门的 Worker 线程）</text>

  <!-- ===== 左：Node / V8 ===== -->
  <rect x="40" y="96" width="440" height="640" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
  <text x="60" y="124" font-size="17" font-weight="bold" fill="#8a5300">Node / V8 世界</text>

  <rect x="60" y="140" width="400" height="160" rx="8" fill="#ffffff" stroke="#e08a00"/>
  <text x="76" y="164" font-size="14" font-weight="bold" fill="#333">宿主代码（实验 .mjs / Pi 的 worker.ts）</text>
  <g font-size="13" font-family="Menlo, monospace" fill="#333">
    <text x="76" y="190">vm.evalCode(code)</text>
    <text x="76" y="211">vm.newFunction("bridge", fn)</text>
    <text x="76" y="232">vm.callFunction(fn, this, ...args)</text>
    <text x="76" y="253">vm.executePendingJobs()</text>
    <text x="76" y="274">vm.dump(h) / h.toString()</text>
  </g>
  <text x="76" y="292" font-size="12" fill="#8a5300">fn 是普通 Node 函数，可以用 Node 的一切能力</text>

  <rect x="60" y="340" width="400" height="260" rx="8" fill="#ffffff" stroke="#e08a00"/>
  <text x="76" y="364" font-size="14" font-weight="bold" fill="#333">quickjs-wasi 的 JS 封装（class QuickJS）</text>
  <g font-size="13" fill="#333">
    <text x="76" y="394"><tspan font-family="Menlo, monospace">hostCallbacks: Map&lt;name, fn&gt;</tspan></text>
    <text x="96" y="413" fill="#777">newFunction 按名字登记回调</text>
    <text x="76" y="441"><tspan font-family="Menlo, monospace">JSValueHandle { ptr }</tspan></text>
    <text x="96" y="460" fill="#777">句柄 = 线性内存里 JSValue 的 u32 指针</text>
    <text x="76" y="488"><tspan font-family="Menlo, monospace">writeString / readString</tspan></text>
    <text x="96" y="507" fill="#777">TextEncoder/Decoder 在 memory.buffer 上编解码</text>
    <text x="76" y="535"><tspan font-family="Menlo, monospace">handleHostCall()</tspan>  ← host_call 的实现</text>
    <text x="76" y="563"><tspan font-family="Menlo, monospace">wasi-shim</tspan>  ← 时钟 / 随机数 / 日志</text>
  </g>
  <!-- handleHostCall → fn -->
  <path d="M 300 340 L 300 302" stroke="#e08a00" stroke-width="2" fill="none" marker-end="url(#o)"/>
  <text x="308" y="326" font-size="12" fill="#8a5300">按名字找到 fn，同步调用</text>

  <rect x="60" y="630" width="400" height="86" rx="8" fill="#fffaf2" stroke="#e08a00" stroke-dasharray="4 3"/>
  <text x="76" y="656" font-size="14" font-weight="bold" fill="#8a5300">Node 能力：fs、net、setTimeout、MCP 工具…</text>
  <text x="76" y="680" font-size="13" fill="#8a5300">VM 看不见这些对象，只能调用 host_call，</text>
  <text x="76" y="700" font-size="13" fill="#8a5300">由宿主的 fn 代为使用（Pi 里就是 bridge）</text>

  <!-- ===== 右：wasm 实例 ===== -->
  <rect x="620" y="96" width="440" height="640" rx="10" fill="#f5f8ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="640" y="124" font-size="17" font-weight="bold" fill="#2a4fa0">WebAssembly.Instance(quickjs.wasm)</text>

  <rect x="640" y="140" width="400" height="120" rx="8" fill="#eefaf2" stroke="#2e9e5b"/>
  <text x="656" y="164" font-size="14" font-weight="bold" fill="#1d6b3c">exports：447 个函数 + memory</text>
  <g font-size="13" font-family="Menlo, monospace" fill="#333">
    <text x="656" y="190">qjs_eval · qjs_call</text>
    <text x="656" y="211">qjs_new_string · qjs_get_string</text>
    <text x="656" y="232">qjs_new_host_function</text>
    <text x="656" y="253">qjs_execute_pending_job · …</text>
  </g>

  <rect x="640" y="290" width="400" height="290" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="656" y="314" font-size="14" font-weight="bold" fill="#2a4fa0">线性内存 memory（一块可增长的 ArrayBuffer）</text>
  <text x="656" y="334" font-size="12" fill="#777">QuickJS 的 C 代码编译成 wasm 指令，所有状态都在这里</text>
  <g font-size="13" fill="#333">
    <rect x="660" y="348" width="360" height="40" rx="6" fill="#eef3ff" stroke="#9db5ea"/>
    <text x="676" y="373"><tspan font-family="Menlo, monospace">JSRuntime / JSContext</tspan>（内存上限、中断）</text>
    <rect x="660" y="398" width="360" height="40" rx="6" fill="#eef3ff" stroke="#9db5ea"/>
    <text x="676" y="423"><tspan font-family="Menlo, monospace">globalThis</tspan>：只有内置对象 + 宿主注入的</text>
    <rect x="660" y="448" width="360" height="40" rx="6" fill="#eef3ff" stroke="#9db5ea"/>
    <text x="676" y="473">JS 堆：对象、字符串、闭包（prelude 也在这）</text>
    <rect x="660" y="498" width="360" height="40" rx="6" fill="#eef3ff" stroke="#9db5ea"/>
    <text x="676" y="523">Job 队列：Promise 回调 / await 恢复</text>
  </g>
  <text x="656" y="564" font-size="12" fill="#777">没有事件循环：job 只在宿主调用 executePendingJobs 时执行</text>

  <rect x="640" y="610" width="400" height="106" rx="8" fill="#fdeeee" stroke="#d93025"/>
  <text x="656" y="634" font-size="14" font-weight="bold" fill="#a3221a">imports：沙箱仅有的出口</text>
  <g font-size="12.5" font-family="Menlo, monospace" fill="#333">
    <text x="656" y="658">env.host_call · host_interrupt</text>
    <text x="656" y="677">env.host_promise_rejection · host_module_*</text>
    <text x="656" y="696">wasi: clock_time_get · random_get · fd_write …</text>
  </g>

  <!-- ===== 跨边界箭头 ===== -->
  <!-- ① 调用导出函数 -->
  <path d="M 460 196 L 638 180" stroke="#2e9e5b" stroke-width="2.2" fill="none" marker-end="url(#g)"/>
  <text x="550" y="172" font-size="13" fill="#1d6b3c" text-anchor="middle">① 调用导出函数</text>
  <!-- ② 返回指针 -->
  <path d="M 640 240 L 462 384" stroke="#777" stroke-width="2" fill="none" marker-end="url(#k)"/>
  <text x="545" y="262" font-size="13" fill="#555" text-anchor="end">② 返回指针</text>
  <text x="545" y="281" font-size="13" fill="#555" text-anchor="end">→ 句柄</text>
  <!-- ③ 读写字节 -->
  <path d="M 462 490 L 638 450" stroke="#3b6fd8" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="552" y="448" font-size="13" fill="#2a4fa0" text-anchor="middle">③ 读写字节</text>
  <text x="552" y="496" font-size="13" fill="#2a4fa0" text-anchor="middle">（复制）</text>
  <!-- ④ host_call -->
  <path d="M 640 652 L 462 532" stroke="#d93025" stroke-width="2.2" fill="none" marker-end="url(#r)"/>
  <text x="578" y="558" font-size="13" fill="#a3221a" text-anchor="middle">④ host_call</text>
  <!-- ⑤ WASI -->
  <path d="M 640 692 L 462 562" stroke="#777" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#k)"/>
  <text x="560" y="694" font-size="13" fill="#555" text-anchor="middle">⑤ WASI</text>

  <!-- ===== 说明 ===== -->
  <g font-size="13.5" fill="#333">
    <text x="30" y="790"><tspan fill="#1d6b3c" font-weight="bold">①</tspan> <tspan font-family="Menlo, monospace">vm.evalCode(code)</tspan>：先 writeString 把源码写进线性内存，再调用导出的 <tspan font-family="Menlo, monospace">qjs_eval(ptr, len, …)</tspan>，QuickJS 在 wasm 里解析执行。</text>
    <text x="30" y="816"><tspan fill="#555" font-weight="bold">②</tspan> 返回的是 JSValue 在线性内存里的 u32 指针，包装成 <tspan font-family="Menlo, monospace">JSValueHandle</tspan>：Node 手里永远是“指针”，不是对象本身。</text>
    <text x="30" y="842"><tspan fill="#2a4fa0" font-weight="bold">③</tspan> <tspan font-family="Menlo, monospace">dump / toString / newString</tspan> 都是在 <tspan font-family="Menlo, monospace">memory.buffer</tspan> 上读写字节再编解码 —— 值被复制，两边没有共享对象。</text>
    <text x="30" y="868"><tspan fill="#a3221a" font-weight="bold">④</tspan> 脚本调用 newFunction 造的函数 → C 跳板调用导入的 <tspan font-family="Menlo, monospace">env.host_call(namePtr, nameLen, thisPtr, argc, argvPtr)</tspan></text>
    <text x="52" y="890">→ <tspan font-family="Menlo, monospace">handleHostCall</tspan> 按名字在 hostCallbacks 里找到 fn，同步执行，返回值再写回内存交给脚本。</text>
    <text x="30" y="916"><tspan fill="#555" font-weight="bold">⑤</tspan> WASI 只提供时钟、随机数、日志这类最小能力（由 wasi-shim 实现），没有文件、网络和定时器。</text>
  </g>
  <rect x="30" y="932" width="1040" height="34" rx="6" fill="#f3f3f3"/>
  <text x="550" y="954" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">边界上只流动数字（指针、长度）和线性内存里的字节；VM 能伸出沙箱的只有 imports 这几个函数 —— 隔离由此而来</text>
</svg>
