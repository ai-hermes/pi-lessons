apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway-image-router
  namespace: ark-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentgateway-image-router
  template:
    metadata:
      labels:
        app: agentgateway-image-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: router
          image: ${IMAGE_ROUTER_IMAGE}
          env:
            # 第三方图片上游地址不入库：部署前替换为真实地址（或改为从 ConfigMap / Secret 引用）
            - name: THIRDPARTY_IMAGE_URL
              value: https://third-party-upstream.example.com/v1/images/generations
            - name: THIRDPARTY_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: thirdparty-image-key
                  key: Authorization
            - name: ARK_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: ark-payg-key
                  key: Authorization
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
