apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ark-image-generation
  namespace: ark-gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
      namespace: agentgateway
  rules:
    - name: model-based-image-generation
      matches:
        - path:
            type: Exact
            value: /v1/images/generations
          method: POST
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: image-model-router
          weight: 1
