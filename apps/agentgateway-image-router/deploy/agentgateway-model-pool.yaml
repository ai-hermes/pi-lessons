# NewAPI-only example; existing Ark Plan/PAYG models are deliberately omitted.
# Requires HTTPRoute/ark-chat with a rule named models. No Secret values included.
apiVersion: v1
kind: List
items:
  - apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayModel
    metadata:
      name: haoduotoken-codex
      namespace: ark-gateway
    spec:
      baseURL: https://byte.haoduotoken.com
      match:
        model: haoduotoken-codex/*
      parentRefs: &chat-parent
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: ark-chat
          sectionName: models
      policies:
        auth:
          secretRef:
            name: haoduotoken-codex-key
        headers:
          response:
            set:
              - name: x-ark-channel
                value: haoduotoken-codex
        health: &channel-health
          eviction:
            consecutiveFailures: 1
            duration: 5m
            healthThreshold: 1
            restoreHealth: 10
          unhealthyCondition: response.code == 429 || response.code >= 500
        transformations:
          - expression: llmRequest.model.stripPrefix("haoduotoken-codex/")
            field: model
      provider: Custom
      custom:
        providerOverride: openai
        formats:
          - type: Completions
            path: /v1/chat/completions
      visibility: Internal

  - apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayModel
    metadata:
      name: haoduotoken-claude
      namespace: ark-gateway
    spec:
      baseURL: https://byte.haoduotoken.com
      match:
        model: haoduotoken-claude/*
      parentRefs: *chat-parent
      policies:
        auth:
          secretRef:
            name: haoduotoken-claude-key
        headers:
          response:
            set:
              - name: x-ark-channel
                value: haoduotoken-claude
        health: *channel-health
        transformations:
          - expression: llmRequest.model.stripPrefix("haoduotoken-claude/")
            field: model
      provider: Custom
      custom:
        providerOverride: openai
        formats:
          - type: Completions
            path: /v1/chat/completions
      visibility: Internal

  - apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayModel
    metadata:
      name: gpt-6-astra
      namespace: ark-gateway
    spec:
      parentRefs: *chat-parent
      virtualModel:
        failover:
          targets:
            - model: haoduotoken-codex/gpt-6-astra
              modelRef:
                name: haoduotoken-codex
              priority: 0

  - apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayModel
    metadata:
      name: gpt-6.1-sol
      namespace: ark-gateway
    spec:
      parentRefs: *chat-parent
      virtualModel:
        failover:
          targets:
            - model: haoduotoken-codex/gpt-6.1-sol
              modelRef:
                name: haoduotoken-codex
              priority: 0

  - apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayModel
    metadata:
      name: claude-fable-5.1
      namespace: ark-gateway
    spec:
      parentRefs: *chat-parent
      virtualModel:
        failover:
          targets:
            - model: haoduotoken-claude/claude-fable-5-1
              modelRef:
                name: haoduotoken-claude
              priority: 0

  - apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayModel
    metadata:
      name: claude-opus-5.5
      namespace: ark-gateway
    spec:
      parentRefs: *chat-parent
      virtualModel:
        failover:
          targets:
            - model: haoduotoken-claude/claude-opus-5-5
              modelRef:
                name: haoduotoken-claude
              priority: 0

  - apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayModel
    metadata:
      name: claude-sonnet-5.5
      namespace: ark-gateway
    spec:
      parentRefs: *chat-parent
      virtualModel:
        failover:
          targets:
            - model: haoduotoken-claude/claude-sonnet-5-5
              modelRef:
                name: haoduotoken-claude
              priority: 0
