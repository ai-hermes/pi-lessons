apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-image-router
  namespace: ark-gateway
spec:
  podSelector:
    matchLabels:
      app: agentgateway-image-router
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: agentgateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
