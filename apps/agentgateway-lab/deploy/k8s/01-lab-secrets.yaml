# Lab-only credentials. Every value here is disposable and must never be reused
# outside the kind lab; production wiring uses External Secrets or SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: lab-secrets
  namespace: agentgateway-demo
type: Opaque
stringData:
  postgres-password: changeme-pg-password
  extauth-dsn: postgres://agw:changeme-pg-password@lab-postgres:5432/agw_lab
  finops-dsn: postgres://agw:changeme-pg-password@lab-postgres:5432/agw_lab
  admin-token: changeme-admin-token
  jwt-secret: changeme-jwt-secret
