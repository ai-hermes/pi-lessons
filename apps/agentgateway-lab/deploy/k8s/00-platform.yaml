apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-backend
  namespace: agentgateway-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-backend
  template:
    metadata:
      labels:
        app: echo-backend
    spec:
      containers:
      - name: echo
        image: agentgateway-lab/echo:v0.1.0
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/app"]
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: echo-backend
  namespace: agentgateway-demo
spec:
  selector:
    app: echo-backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-demo
  namespace: agentgateway-demo
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-demo
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agentgateway-demo
  namespace: agentgateway-demo
spec:
  image:
    registry: cr.agentgateway.dev
    repository: agentgateway
    tag: v1.7.0
    pullPolicy: IfNotPresent
  service:
    spec:
      type: NodePort
      ports:
      - name: http
        port: 8080
        targetPort: 8080
        nodePort: 30080
  # Realized cost: agentgateway prices every request from this catalog, so the
  # access log carries `agw.ai.usage.cost.total` next to the token counts.
  modelCatalog:
    sources:
    - configMap:
        name: lab-model-catalog
        key: catalog.json
---
# Prices are USD per million tokens, as strings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-model-catalog
  namespace: agentgateway-demo
data:
  catalog.json: |
    {
      "providers": {
        "openai": {
          "models": {
            "lab-model": {
              "rates": {
                "input": "3",
                "output": "12",
                "cacheRead": "1"
              }
            }
          }
        }
      }
    }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: agentgateway-demo
spec:
  parentRefs:
  - name: agentgateway-demo
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /echo
    backendRefs:
    - name: echo-backend
      port: 8080
