# Traces are the audit half of telemetry: every request gets a span with the
# extAuth identity attached, so "who called what, when" is answerable even
# after the access log is rotated away.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: gateway-tracing
  namespace: agentgateway-demo
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-demo
  frontend:
    tracing:
      protocol: GRPC
      backendRef:
        name: finops
        port: 9101
      randomSampling: "1"
      attributes:
        add:
        - name: lab.client.id
          expression: 'request.headers["x-client-id"]'
      resources:
      - name: lab.cost.mode
        expression: '"realized-from-catalog"'
---
# Custom Prometheus labels: identity also lands on token metrics, so dashboards
# can break spend down by client without joining a log store.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: gateway-metrics-labels
  namespace: agentgateway-demo
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-demo
  frontend:
    metrics:
      attributes:
        add:
        - name: client_id
          expression: 'request.headers["x-client-id"]'
