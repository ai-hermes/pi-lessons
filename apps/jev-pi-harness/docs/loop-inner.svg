<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1280" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Loop 内：每次工具调用都先过 Gate</text>
  <text x="40" y="84" font-size="15" fill="#475569">Gate 挂在 Pi Agent 的 beforeToolCall 上。便宜、确定的代码规则在前，拿不准的才问 Jev，最后由代码里的阈值做决定。</text>

  <!-- Pi agent loop -->
  <rect x="40" y="120" width="320" height="640" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="150" font-size="16" font-weight="700" fill="#1d4ed8">Pi Agent 循环（pi-agent-core）</text>

  <rect x="70" y="170" width="260" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="196" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">模型（Kimi）</text>
  <text x="200" y="220" font-size="13" fill="#475569" text-anchor="middle">看对话，决定下一步调用哪个工具</text>
  <text x="200" y="256" font-size="12" fill="#64748b" text-anchor="middle">不再调用工具时，回答交给 Verifier</text>

  <rect x="70" y="420" width="260" height="84" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="455" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">执行 Pi 内置工具</text>
  <text x="200" y="482" font-size="14" fill="#475569" text-anchor="middle">read · edit · write · bash</text>

  <rect x="70" y="616" width="260" height="100" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="650" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">结果写回对话</text>
  <text x="200" y="676" font-size="14" fill="#475569" text-anchor="middle">工具输出，或拦截原因</text>
  <text x="200" y="698" font-size="12" fill="#b91c1c" text-anchor="middle">拦截时附带：别重试，也别绕路</text>

  <!-- loop arrows -->
  <line x1="200" y1="504" x2="200" y2="610" stroke="#64748b" stroke-width="2" marker-end="url(#a-gray)"/>
  <path d="M70,666 H52 V202 H64" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-gray)"/>

  <!-- tool call into gate -->
  <line x1="330" y1="202" x2="464" y2="202" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="400" y="192" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">工具调用</text>

  <!-- Gate container -->
  <rect x="440" y="120" width="500" height="640" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="460" y="150" font-size="16" font-weight="700" fill="#0f172a">Gate · beforeToolCall</text>

  <!-- steps -->
  <g font-size="15">
    <rect x="470" y="170" width="320" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="486" y="198" font-weight="700" fill="#0f172a">① 不是已知的工具？</text>
    <text x="486" y="220" font-size="13" fill="#64748b">代码判断</text>

    <rect x="470" y="270" width="320" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="486" y="298" font-weight="700" fill="#0f172a">② read/edit/write 的路径越出工作区？</text>
    <text x="486" y="320" font-size="13" fill="#64748b">代码判断：..、~、外部绝对路径、符号链接</text>

    <rect x="470" y="370" width="320" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="486" y="398" font-weight="700" fill="#0f172a">③ 只是读文件（read）？</text>
    <text x="486" y="420" font-size="13" fill="#64748b">代码判断，不调用 Jev</text>

    <rect x="470" y="470" width="320" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="486" y="498" font-weight="700" fill="#5b21b6">④ 问 Jev（是非题，给概率）</text>
    <text x="486" y="520" font-size="13" fill="#5b21b6">destructive：会毁掉不是本轮创建的数据？</text>
    <text x="486" y="540" font-size="13" fill="#5b21b6">irreversible：做了就撤不回？</text>
    <text x="486" y="560" font-size="13" fill="#5b21b6">outsideWorkspace（仅 bash）：碰到工作区外？</text>

    <rect x="470" y="600" width="320" height="104" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="486" y="628" font-weight="700" fill="#0f172a">⑤ decideGate（代码）</text>
    <text x="486" y="652" font-size="13" fill="#334155">三个信号里风险最高的那个说了算</text>
    <text x="486" y="674" font-size="13" fill="#334155">≥ 0.88 拦截 · ≥ 0.65 问人 · 其余放行</text>
    <text x="486" y="694" font-size="13" fill="#334155">信号缺失或超出 0–1 按 1 处理</text>
  </g>

  <!-- "no" arrows -->
  <g font-size="12" fill="#64748b">
    <line x1="630" y1="234" x2="630" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#a-gray)"/><text x="638" y="254">否</text>
    <line x1="630" y1="334" x2="630" y2="364" stroke="#64748b" stroke-width="2" marker-end="url(#a-gray)"/><text x="638" y="354">否</text>
    <line x1="630" y1="434" x2="630" y2="464" stroke="#64748b" stroke-width="2" marker-end="url(#a-gray)"/><text x="638" y="454">否：edit / write / bash</text>
    <line x1="630" y1="574" x2="630" y2="594" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-gray)"/><text x="638" y="589" fill="#5b21b6">概率</text>
  </g>

  <!-- outcomes column -->
  <g font-size="14">
    <rect x="980" y="170" width="260" height="164" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="996" y="200" font-size="16" font-weight="700" fill="#b91c1c">拦截（代码）</text>
    <text x="996" y="226" fill="#7f1d1d">未知工具、越界路径直接拦下，</text>
    <text x="996" y="248" fill="#7f1d1d">不问 Jev。</text>
    <text x="996" y="280" fill="#7f1d1d">硬边界写在代码里，</text>
    <text x="996" y="302" fill="#7f1d1d">模型说什么都绕不过去。</text>

    <rect x="980" y="370" width="260" height="64" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="996" y="398" font-size="16" font-weight="700" fill="#15803d">放行</text>
    <text x="996" y="420" fill="#14532d">只读，省一次 Jev 调用</text>

    <rect x="980" y="480" width="260" height="64" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="996" y="508" font-size="16" font-weight="700" fill="#b91c1c">拦截（Jev 不可用）</text>
    <text x="996" y="530" fill="#7f1d1d">超时、出错、答非所问都算</text>

    <rect x="980" y="580" width="260" height="40" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="996" y="606" font-weight="700" fill="#15803d">&lt; 0.65 放行</text>
    <rect x="980" y="632" width="260" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="996" y="655" font-weight="700" fill="#b45309">0.65–0.88 问人 [y/N]</text>
    <text x="996" y="676" font-size="13" fill="#78350f">60 秒没回应或没有终端 = 拒绝</text>
    <rect x="980" y="700" width="260" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="996" y="726" font-weight="700" fill="#b91c1c">≥ 0.88 拦截</text>
  </g>

  <!-- "yes" arrows to outcomes -->
  <g font-size="12">
    <line x1="790" y1="202" x2="974" y2="202" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="870" y="194" fill="#b91c1c">是</text>
    <line x1="790" y1="302" x2="974" y2="302" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="870" y="294" fill="#b91c1c">是</text>
    <line x1="790" y1="402" x2="974" y2="402" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/><text x="870" y="394" fill="#15803d">是</text>
    <line x1="790" y1="512" x2="974" y2="512" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-red)"/><text x="808" y="504" fill="#b91c1c">失败 → fail closed</text>
    <path d="M790,630 H900 V600 H974" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/>
    <line x1="790" y1="660" x2="974" y2="660" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/>
    <path d="M790,690 H900 V720 H974" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
  </g>

  <!-- back to the loop -->
  <line x1="440" y1="462" x2="336" y2="462" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/>
  <text x="400" y="452" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">放行</text>
  <line x1="440" y1="666" x2="336" y2="666" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>
  <text x="400" y="656" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">拦截</text>

  <!-- footer -->
  <rect x="40" y="784" width="1200" height="48" rx="10" fill="#f1f5f9"/>
  <text x="60" y="814" font-size="14" fill="#334155">Jev 只看到工具名、脱敏后的参数和代码算出的路径信息，看不到诱导模型的文件原文。每个决策（信号、耗时、Jev 版本）脱敏后追加到 decisions.jsonl。</text>
</svg>
